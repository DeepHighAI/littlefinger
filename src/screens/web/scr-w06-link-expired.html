<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-W06 링크 무효·만료 안내 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/web.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-W06" data-screen-name="링크 무효·만료 안내">

<div class="lf-device">
  <div class="lf-device__viewport">

    <!-- 카톡 인앱 브라우저에서 열리는 화면. 광고 금지. 종결 안내만 하며 주 CTA 없음. -->
    <div class="lf-screen">

      <div class="lf-browserbar">
        <button class="lf-icon-button" type="button" aria-label="닫기">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <div class="lf-browserbar__identity">
          <span class="lf-browserbar__name">리틀핑거</span>
          <span class="lf-browserbar__host">promise.littlefinger.app</span>
        </div>
        <button class="lf-icon-button" type="button" aria-label="더보기">
          <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
        </button>
      </div>

      <div class="lf-screen__body lf-screen__body--web lf-screen__body--centered lf-gap-5">

        <div class="lf-status-icon">
          <span class="material-symbols-rounded" aria-hidden="true">link_off</span>
        </div>

        <h1 class="lf-title lf-title--web">이 링크는 더 쓸 수 없어요</h1>

        <p class="lf-body--secondary">초대 링크가 만료됐거나(72시간)<br>이미 사용된 링크예요.<br>지우님에게 재발송을 부탁해 주세요</p>

        <p class="lf-notice">
          <span class="material-symbols-rounded" aria-hidden="true">info</span>
          <span>초대 링크는 1회용이에요</span>
        </p>

      </div>

    </div>
  </div>
</div>

<script src="../frame.js"></script>
</body>
</html>
