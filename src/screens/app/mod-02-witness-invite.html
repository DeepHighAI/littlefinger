<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-02 증인 초대 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="MOD-02" data-screen-name="증인 초대">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <!-- 배경 — 약속 상세(SCR-A05) 화면이 흐릿하게 비치는 자리표시자. 실제 콘텐츠가 아니므로 스크린리더에서 숨김 -->
      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar">
          <button class="lf-icon-button lf-icon-button--strong" type="button" tabindex="-1" aria-label="뒤로가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          </button>
          <span class="lf-appbar__title">약속 상세</span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-row lf-gap-3">
            <span class="lf-chip lf-chip--status">진행 중</span>
            <span class="lf-dday lf-dday--lg lf-push-right">D-17</span>
          </div>
          <p class="lf-title">매주 화·목 아침 러닝 같이 하기</p>
          <div class="lf-backdrop__block lf-backdrop__block--accent lf-backdrop__block--120"></div>
          <div class="lf-backdrop__block lf-backdrop__block--60"></div>
        </div>
      </div>

      <div class="lf-scrim"></div>

      <div class="lf-sheet" role="dialog" aria-modal="true" aria-labelledby="mod02-title">
        <div class="lf-sheet__handle" aria-hidden="true"></div>

        <div class="lf-row lf-gap-3">
          <h1 class="lf-sheet__title lf-grow" id="mod02-title">증인 초대</h1>
          <span class="lf-chip lf-chip--neutral">1 / 2</span>
        </div>
        <p class="lf-caption">약속을 지켜봐 줄 사람을 불러요 (최대 2명)</p>

        <!-- F-05: 최대 2명, 현재 1/2 슬롯 상태 -->
        <ul class="lf-stack lf-gap-3">
          <li class="lf-witness">
            <span class="lf-avatar" aria-hidden="true">하</span>
            <div class="lf-witness__body">
              <p class="lf-witness__name">하영</p>
              <p class="lf-witness__meta">어제 18:03 확인 서명</p>
            </div>
            <span class="lf-chip lf-chip--signed">서명 완료</span>
          </li>
          <li class="lf-witness lf-witness--empty">
            <span class="lf-witness__avatar--empty" aria-hidden="true">
              <span class="material-symbols-rounded">person_add</span>
            </span>
            <p class="lf-witness__empty-label">한 자리 남았어요</p>
          </li>
        </ul>

        <div class="lf-hint">
          <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
          <span class="lf-hint__text">증인은 내용을 확인만 해요 — 판정 권한은 없어요</span>
        </div>

        <!-- 카카오 공식 버튼 가이드 형태 플레이스홀더 (요청서 §8) -->
        <button type="button" class="lf-btn lf-btn--kakao lf-btn--cta lf-btn--block">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.4.3.7.6.5l4.1-2.7c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/>
          </svg>
          <span>카카오톡으로 증인 초대하기</span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
