# Supabase 로컬 개발 설정. 원격 프로젝트 연결은 `supabase link` 가 별도로 관리한다.
project_id = "littlefinger"

[db]
port = 54322
major_version = 17

[api]
port = 54321
schemas = ["public"]

[auth]
# 앱 딥링크. 04 §8 · 카카오 설정 핸드오프 참조.
site_url = "littlefinger://login-callback/"
additional_redirect_urls = [
  "littlefinger://auth-callback",
  "https://littlefinger.pages.dev",
  "https://littlefinger.pages.dev/**",
]
# 02 §11-3 기본안: access 30분 / refresh 30일
jwt_expiry = 1800
enable_refresh_token_rotation = true

# ============================================================
# Edge Functions — 04 §7-3
#
# `verify_jwt` 는 **함수를 여기에 적지 않으면 값이 전송되지 않는다.** 서버는 이전 값을 그대로
# 유지하므로, 빠뜨린 함수는 "기본값이 뭐였더라"에 운명을 맡기는 셈이 된다. 네 개를 모두 적는다.
# ============================================================

# SCR-W01 은 카카오 로그인 **이전** 화면이다(§4-3-3). 서비스에서 로그인 전에 DB 를 건드리는
# 유일한 경로이고, 그래서 RPC 가 작성자 닉네임·제목·만료·역할 네 가지만 돌려준다.
[functions.invite-resolve]
verify_jwt = false

# 나머지 셋은 상태 전이다. §9 권한 매트릭스가 승인·거절·수정 제안을 PARTNER 에게만 주므로
# 익명에게 열려서는 안 된다.
[functions.promise-approve]
verify_jwt = true

[functions.promise-decline]
verify_jwt = true

[functions.promise-amend]
verify_jwt = true

[auth.external.kakao]
enabled = true
# 실제 값은 Supabase Dashboard 와 로컬 .env 에만 둔다. 저장소에 키를 넣지 않는다.
client_id = "env(KAKAO_REST_API_KEY)"
secret = "env(KAKAO_CLIENT_SECRET)"
