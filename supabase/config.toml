# Supabase 로컬 개발 설정. 원격 프로젝트 연결은 `supabase link` 가 별도로 관리한다.
project_id = "littlefinger"

[db]
port = 54322
major_version = 17

[api]
port = 54321
schemas = ["public"]

# ============================================================
# auth 는 **주석으로만** 둔다. 살아 있는 키로 두지 않는다.
#
# `supabase config push` 는 드리프트가 하나라도 있으면 auth 설정 **전체**를 PATCH 한다 —
# site_url·리다이렉트 허용목록·jwt_expiry 만이 아니라 disable_signup·비밀번호 규칙·
# rate limit 까지 로컬 기본값으로 덮어쓴다. 그리고 아래 목록은 완성본이 아니다:
# `littlefinger://**` 가 빠져 있고, pages.dev 하위 도메인은 C-3 이 아직 열려 있어 확정값이
# 아니며, 대시보드에만 있는 "Allow users without an email"(§6-1)은 표현할 방법이 없다.
# 부분만 적힌 config-as-code 는 없는 것보다 나쁘다 — 정본처럼 보이는데 부분집합이다.
#
# **정본은 Supabase Dashboard 다.** 의도값의 근거는 아래 문서에 있다:
#   docs/handoff/2026-07-26-kakao-supabase-oauth-findings.md
#
# 참고용 의도값 (Dashboard 에 이 값들이 들어가 있어야 한다):
#   site_url                      littlefinger://login-callback/
#   additional_redirect_urls      littlefinger://auth-callback
#                                 littlefinger://**
#                                 https://<수락웹 도메인>  및 /**
#   jwt_expiry                    1800        (02 §11-3 기본안: access 30분)
#   enable_refresh_token_rotation true        (refresh 30일)
#   Allow users without an email  ON          (§6-1 — 없으면 이메일 미제공 계정이 500)
# ============================================================

# ============================================================
# Edge Functions — 04 §7-3
#
# `verify_jwt` 는 **함수를 여기에 적지 않으면 값이 전송되지 않는다.** 서버는 이전 값을 그대로
# 유지하므로, 빠뜨린 함수는 "기본값이 뭐였더라"에 운명을 맡기는 셈이 된다. 전부 적는다.
# ============================================================

# SCR-W01 은 카카오 로그인 **이전** 화면이다(§4-3-3). 서비스에서 로그인 전에 DB 를 건드리는
# 유일한 경로이고, 그래서 RPC 가 작성자 닉네임·제목·만료·역할 네 가지만 돌려준다.
[functions.invite-resolve]
verify_jwt = false

# SCR-W02 는 같은 링크의 **로그인 후** 화면이다(§4-3-4). 여기서만 약속 전문·보상·벌칙이
# 나가므로 익명에게 열리면 invite-resolve 가 로그인 전에 그것들을 감춘 의미가 사라진다.
# RPC 도 user_id 를 받아 승인과 같은 열람자 가드(자기 초대·중복 역할·차단)를 돌린다.
[functions.invite-preview]
verify_jwt = true

# 작성·초대 발송은 작성자 전용이다(§9). 익명에게 열리면 남의 이름으로 약속을 만들 수 있는
# 것은 물론이고, EC-H05 의 사용자당 한도가 셀 대상을 잃는다.
[functions.promise-create]
verify_jwt = true

[functions.promise-invite]
verify_jwt = true

# 나머지 셋은 상태 전이다. §9 권한 매트릭스가 승인·거절·수정 제안을 PARTNER 에게만 주므로
# 익명에게 열려서는 안 된다.
[functions.promise-approve]
verify_jwt = true

[functions.promise-decline]
verify_jwt = true

[functions.promise-amend]
verify_jwt = true

# 로그인 뒤 자기 users 행 보정이다(핸드오프 2026-07-30). p_user_id 는 JWT 에서만 오므로
# 익명에게 열릴 이유가 없다.
[functions.user-provision]
verify_jwt = true

# Android 앱 로그인 뒤 Expo Push Service 토큰을 등록한다(§4-1-3.5).
[functions.device-token-register]
verify_jwt = true

[functions.promise-draft-update]
verify_jwt = true

[functions.invite-revoke]
verify_jwt = true

[functions.participant-promise-list]
verify_jwt = true

[functions.promise-fulfillment-detail]
verify_jwt = true

[functions.fulfillment-submit]
verify_jwt = true

[functions.fulfillment-reopen]
verify_jwt = true

[functions.evidence-upload]
verify_jwt = true

[functions.evidence-discard]
verify_jwt = true

[functions.evidence-sign-url]
verify_jwt = true

# J-08가 내부 비밀 헤더로 인증하므로 플랫폼 JWT는 사용하지 않는다.
[functions.evidence-purge]
verify_jwt = false

# ============================================================
# 카카오 프로바이더 블록을 **의도적으로 두지 않는다.**
#
# 블록이 있으면 `supabase config push` 가 client_id 를 리터럴 문자열
# `"env(KAKAO_REST_API_KEY)"` 로 덮어쓴다 — 빈 값도, 건너뛰기도 아니다. CLI 소스에서 확인했다:
# `secret` 은 Secret 타입이라 env() 미해결 시 가드가 걸리지만 `client_id` 는 그냥 string 이라
# 가드가 없다. 검증도 못 잡는다(리터럴은 빈 문자열이 아니다). 확인 프롬프트도 방어가 아니다 —
# 기본값이 yes 이고 TTY 가 아니면 그대로 진행한다.
#
# 결과는 조용하다: 대시보드에는 설정된 것처럼 보이는데 카카오에 없는 client_id 를 보내
# 모든 로그인이 실패한다. 되돌리려면 키를 손으로 다시 넣는 수밖에 없다.
#
# 블록이 없으면 CLI 는 이 프로바이더에 **구조적으로 닿을 수 없다** — 양쪽 구현 모두
# config.toml 에 실재하는 프로바이더만 순회하므로 `external_kakao_*` 키가 요청 본문에
# 아예 들어가지 않는다.
#
# 로컬 `supabase start` 에서 카카오가 빠지는 것이 대가인데, 이 저장소에는 Docker 가 없어
# 로컬 스택을 띄우지 않으므로 비용이 0 이다(CLAUDE.md §3).
# ============================================================
