# 무료 플랜에는 자동 백업이 없다(04 §7-5). 주 1회 덤프를 떠 아티팩트로 보관한다.
#
# `supabase db dump` 를 쓰지 않고 `pg_dump` 를 직접 부른다. CLI 는 덤프를 **Docker 컨테이너 안에서**
# 수행하느라 매 실행마다 `supabase/postgres` 이미지(수백 MB)를 내려받고, 그러고 나서야 접속에
# 실패했다 — 2026-07-27, 이미지 전체를 받은 뒤 IPv6 도달 불가로 죽었다. 진단 한 번에 2분이 든다.
# pg_dump 를 직접 부르면 이미지도 CLI 의존도 없고, 접속 문자열이 그대로 쓰인다.
name: supabase weekly backup

on:
  schedule:
    # 매주 일요일 19:00 UTC = 월요일 04:00 KST. 배치가 몰리는 시간대를 피한다.
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 접속 문자열이 pooler 인지 먼저 확인
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # 값을 출력하지 않고 호스트와 포트만 꺼내 본다. 이 검사가 앞에 있어야 잘못된 값이
        # 20초 뒤가 아니라 즉시, 고칠 방법과 함께 드러난다.
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL 시크릿이 비어 있습니다."
            exit 1
          fi

          hostport=$(printf '%s' "${SUPABASE_DB_URL}" | sed -E 's|^.*@([^/?]+).*|\1|')
          host=${hostport%%:*}
          port=${hostport##*:}
          echo "host=${host} port=${port}"

          # 직접 접속 주소는 IPv6 전용이고 GitHub 러너는 IPv4 전용이라 아예 닿지 않는다.
          case "${host}" in
            *.pooler.supabase.com) ;;
            *)
              echo "::error::SUPABASE_DB_URL 이 pooler 가 아닙니다 (host=${host}). Dashboard → Project Settings → Database → Connection string → **Session pooler** 값을 넣으세요. 직접 접속 주소(db.<ref>.supabase.co)는 IPv6 전용이라 러너에서 닿지 않습니다."
              exit 1
              ;;
          esac

          # Transaction pooler(6543)는 IPv4 지만 트랜잭션 모드라 pg_dump 가 못 돈다.
          if [ "${port}" != "5432" ]; then
            echo "::error::포트가 ${port} 입니다. pg_dump 는 **Session pooler(5432)** 가 필요합니다 — Transaction pooler(6543)는 트랜잭션 모드라 동작하지 않습니다."
            exit 1
          fi

      - name: PostgreSQL 17 클라이언트 설치
        # 원격은 PG 17 이고, pg_dump 는 자기보다 **높은** 서버 버전을 거부한다.
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          # **설치만으로는 부족하다.** 러너에는 PG 16 클라이언트가 이미 있고 `/usr/bin/pg_dump`
          # 가 그쪽을 가리킨다. 17 을 깔아도 그냥 `pg_dump` 를 부르면 16 이 잡혀
          # "server version mismatch" 로 죽는다 — 2026-07-27 에 이걸로 실패했다.
          # PATH 순서에 기대지 않고 절대 경로를 고정해 다음 스텝으로 넘긴다.
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"

      - name: pg_dump 가 정말 17 인지 확인
        # 덤프를 뜨기 전에 끊는다. 버전이 어긋나면 어차피 한 줄도 못 뜨고,
        # 여기서 죽어야 원인이 "무엇을 설치해야 하는지"로 바로 읽힌다.
        run: |
          set -euo pipefail
          if [ ! -x "${PG_DUMP}" ]; then
            echo "::error::${PG_DUMP} 가 없습니다. postgresql-client-17 설치가 실패했습니다."
            exit 1
          fi
          "${PG_DUMP}" --version
          "${PG_DUMP}" --version | grep -qE ' 17\.' || {
            echo "::error::pg_dump 가 17 이 아닙니다: $("${PG_DUMP}" --version)"
            exit 1
          }

      - name: 스키마와 데이터를 덤프
        env:
          # GitHub Secrets 에만 두고 저장소에는 절대 넣지 않는다(04 §9).
          # 비밀번호의 특수문자는 퍼센트 인코딩한다.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup

          # `public` 만 뜬다. auth·storage 등 Supabase 관리 스키마는 이 역할로 온전히 덤프되지도,
          # 되돌려 넣지도 못한다. 스키마 정본은 어차피 supabase/migrations/ 로 git 에 있으므로
          # 이 백업의 실질 가치는 **데이터** 쪽이다.
          #
          # --no-owner / --no-privileges: 소유자와 권한은 마이그레이션이 다시 만든다.
          # -x 는 쓰지 않는다(권한 구문 제거는 --no-privileges 로 충분하고 의미가 겹친다).
          # `pg_dump` 가 아니라 `${PG_DUMP}` 다. PATH 에는 러너 기본 16 이 앞서 있다.
          "${PG_DUMP}" "${SUPABASE_DB_URL}" \
            --schema=public --schema-only --no-owner --no-privileges \
            -f backup/schema.sql
          "${PG_DUMP}" "${SUPABASE_DB_URL}" \
            --schema=public --data-only --no-owner --no-privileges \
            -f backup/data.sql

          ls -la backup/

          # 0바이트 덤프를 조용히 업로드하면 백업이 있다고 착각하게 된다. 있는 것보다 나쁘다.
          for f in backup/schema.sql backup/data.sql; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} 가 비었습니다. 덤프가 실패했는데 종료 코드가 0 이었습니다."
              exit 1
            fi
          done

          # 스키마 덤프에 실제 테이블이 있는지 최소한으로 확인한다.
          if ! grep -q "CREATE TABLE" backup/schema.sql; then
            echo "::error::schema.sql 에 CREATE TABLE 이 없습니다. 잘못된 데이터베이스를 떴을 수 있습니다."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          # 무료 저장 용량을 고려해 90일. 그 이상 보관이 필요하면 외부로 옮긴다.
          retention-days: 90
