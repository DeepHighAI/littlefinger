<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A05 / COMPLETED 완료 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-detail.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A05 / COMPLETED" data-screen-name="완료">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button lf-icon-button--strong" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">약속 상세</h1>
        <button class="lf-icon-button" type="button" aria-label="공유">
          <span class="material-symbols-rounded" aria-hidden="true">share</span>
        </button>
      </header>

      <div class="lf-screen__body">

        <div class="lf-row lf-gap-3">
          <span class="lf-chip lf-chip--reward">완료</span>
          <span class="lf-caption">2026-08-12 종결</span>
        </div>

        <h2 class="lf-title">매주 화·목 아침 러닝 같이 하기</h2>

        <div class="lf-stamp lf-stamp--compact lf-stamp--reward">
          <span class="material-symbols-rounded lf-stamp__icon" aria-hidden="true">celebration</span>
          <p class="lf-stamp__headline">약속 지킴! 완주했어요</p>
          <p class="lf-stamp__time">두 사람 모두 "지켰어요" · 8/12 11:40 확인</p>
          <p class="lf-fingerprint">
            <span class="material-symbols-rounded" aria-hidden="true">fingerprint</span>
            <span>기록 지문</span>
            <span class="lf-fingerprint__code">A3F9-77C2-01</span>
          </p>
        </div>

        <div>
          <p class="lf-section-title">증빙</p>
          <div class="lf-row lf-gap-3">
            <div class="lf-photo">
              <span class="material-symbols-rounded" aria-hidden="true">image</span>
              <span class="lf-photo__caption">지우 · 1장</span>
            </div>
            <div class="lf-photo">
              <span class="material-symbols-rounded" aria-hidden="true">image</span>
              <span class="lf-photo__caption">민준 · 1장</span>
            </div>
          </div>
        </div>

        <div class="lf-card lf-info-row">
          <span class="material-symbols-rounded lf-icon-primary" aria-hidden="true">redeem</span>
          <div class="lf-grow">
            <p class="lf-info-row__label">이제 보상 받을 차례</p>
            <p class="lf-info-row__value">성공하면 오마카세 사주기</p>
          </div>
        </div>

        <p class="lf-caption lf-text-center">약속 지킴율에 반영됐어요 · 축하 카드는 완료 순간(MOD-03)에 떠요</p>

      </div>

      <div class="lf-screen__actions">
        <div class="lf-screen__actions-row">
          <button class="lf-btn lf-btn--outlined lf-btn--grow" type="button">공유하기</button>
          <button class="lf-btn lf-btn--filled lf-btn--grow" type="button">새 약속 만들기</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
