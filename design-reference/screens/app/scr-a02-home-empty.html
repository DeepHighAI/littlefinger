<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A02 홈 · 빈 상태 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-entry.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 잉크 & 블록 (2026-09-06): A00 과 같은 흰+옐로 블롭(240×211, 잉크 5px 드롭섀도) 안에서 C-1 손 루프가 첫 약속을 유도. 크롬은 홈과 같다. -->
<body class="lf-page" data-screen-id="SCR-A02" data-screen-name="홈 · 빈 상태">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar lf-appbar--brand">
        <span class="lf-appbar__mascot" aria-hidden="true"><img class="lf-mascot lf-mascot--sm" src="../../assets/images/mascot-face-e1.png" alt=""></span>
        <h1 class="lf-appbar__wordmark">리틀핑거</h1>
        <button class="lf-appbar__menu" type="button" aria-label="메뉴">
          <span>메뉴</span>
          <span class="material-symbols-rounded" aria-hidden="true">menu</span>
        </button>
      </header>

      <div class="lf-home__headline">
        <h2 class="lf-headline">아직 건 약속이<br>없어요.</h2>
      </div>

      <div class="lf-tabs lf-home__tabs" role="tablist" aria-label="약속 상태 필터">
        <button class="lf-tab" type="button" role="tab" aria-selected="true">진행 중 0</button>
        <button class="lf-tab" type="button" role="tab" aria-selected="false">대기 0</button>
        <button class="lf-tab" type="button" role="tab" aria-selected="false">지난 약속</button>
      </div>

      <div class="lf-screen__body lf-screen__body--centered lf-empty lf-home__empty">

        <div class="lf-blob lf-blob--empty" aria-hidden="true">
          <svg class="lf-blob__svg" viewBox="0 0 330 290">
            <path class="lf-blob__paper" d="M120 40c60-30 130 10 140 70s-20 120-90 120S30 210 30 150 60 70 120 40Z"/>
            <path class="lf-blob__yellow" d="M200 160c40-20 100 0 110 40s-10 80-60 80-70-20-90-50 0-50 40-70Z"/>
          </svg>
          <div class="lf-blob__eyes">
            <span class="lf-pinky-loop lf-pinky-loop--eyes lf-pinky-loop--half">
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
              <span class="lf-pinky-loop__spark"></span>
            </span>
          </div>
        </div>

        <p class="lf-home__empty-copy">소중한 사람과 새끼손가락 걸고<br>지킬 약속을 만들어보세요.</p>
        <p class="lf-empty__hint">아래 <span class="lf-highlight">약속 만들기</span>를 눌러 시작해요</p>

      </div>

      <button class="lf-fab" type="button">
        <span>약속 만들기</span>
        <span class="lf-btn__trailing" aria-hidden="true"><span class="material-symbols-rounded">add</span></span>
      </button>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
