<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A01 로그인 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-entry.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4e (2026-09-03): 블롭 + 워드마크. 카카오 공식 색 유지, 잉크 테두리만. Google 버튼은 구현본(N-4)대로 함께 둔다. -->
<body class="lf-page" data-screen-id="SCR-A01" data-screen-name="로그인">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <div class="lf-login__top"></div>

      <div class="lf-screen__body lf-screen__body--centered lf-login__body">

        <div class="lf-blob lf-blob--login lf-blob--tilt" aria-hidden="true">
          <svg class="lf-blob__svg" viewBox="0 0 220 200">
            <path class="lf-blob__paper" d="M110 12c70-10 106 40 100 90s-50 92-104 88S6 150 10 100 50 20 110 12Z"/>
            <path class="lf-blob__yellow" d="M150 120c34-14 66 8 62 40s-30 44-62 38-40-26-34-48 14-24 34-30Z"/>
          </svg>
          <div class="lf-blob__eyes">
            <span class="lf-pinky-loop lf-pinky-loop--eyes">
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
              <span class="lf-pinky-loop__spark"></span>
            </span>
          </div>
        </div>

        <div>
          <h1 class="lf-wordmark">리틀핑거</h1>
          <p class="lf-login__subtitle">새끼손가락 걸고, 약속!</p>
        </div>

        <p class="lf-login__hook">오늘도 새끼손가락 걸어볼까요?</p>

      </div>

      <div class="lf-screen__actions lf-screen__actions--plain lf-login__actions">
        <!-- 카카오 공식 버튼 가이드 형태 (요청서 §8) -->
        <button class="lf-btn lf-btn--kakao lf-btn--block" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.4.3.7.6.5l4.1-2.7c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/>
          </svg>
          <span>카카오로 시작하기</span>
        </button>
        <!-- Google 공식 가이드 — 흰 배경 + 1px 테두리, 형태만 필 (PO 2026-08-20) -->
        <button class="lf-btn lf-btn--google lf-btn--cta lf-btn--block" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.2z"/>
            <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.2H4.3v5.7C7.9 40.9 15.4 46 24 46z"/>
            <path fill="#FBBC05" d="M11.6 28c-.5-1.3-.7-2.6-.7-4s.3-2.7.7-4v-5.7H4.3A22 22 0 0 0 2 24c0 3.6.9 6.9 2.3 9.7L11.6 28z"/>
            <path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.3 30 2 24 2 15.4 2 7.9 7.1 4.3 14.3l7.3 5.7c1.7-5.3 6.6-9.2 12.4-9.2z"/>
          </svg>
          <span>Google로 시작하기</span>
        </button>
        <p class="lf-login__terms">시작하면 <a href="#">이용약관</a>과 <a href="#">개인정보 처리방침</a>에 동의하게 돼요</p>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
