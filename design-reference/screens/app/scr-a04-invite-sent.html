<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A04 초대 전송·대기 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-create.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4g (2026-09-03): 초대 링크 미리보기 카드 · 만료 카운트다운.
     D6: 기본 노란 공유 버튼 + 현재 라벨 '초대 링크 공유하기'(OS 공유 시트) + 아웃라인 '링크 복사하기'.
     수락 대기 단계에는 상대 이름이 없으므로 '상대방' 으로 쓴다 (D5). -->
<body class="lf-page" data-screen-id="SCR-A04" data-screen-name="초대 전송·대기">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">초대 보내기</h1>
        <span class="lf-chip lf-chip--sm lf-chip--paper">수락 대기</span>
      </header>

      <div class="lf-screen__body">

        <div class="lf-stamp">
          <svg class="lf-blob--corner lf-blob--corner-right" viewBox="0 0 90 70" aria-hidden="true">
            <path class="lf-blob__soft-yellow" d="M40 6c22-10 50 6 46 30S60 68 36 66 4 50 8 32 22 14 40 6Z"/>
          </svg>
          <span class="lf-stamp__pill" aria-hidden="true">
            <span class="lf-pinky-loop lf-pinky-loop--sm">
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-color.png" alt=""></span>
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-color.png" alt=""></span>
              <span class="lf-pinky-loop__spark"></span>
            </span>
          </span>
          <p class="lf-stamp__headline">상대방에게 손가락을<br>내밀어 볼까요?</p>
          <p class="lf-stamp__body">초대 링크를 공유하면, 상대방이 걸어야 성립돼요</p>
        </div>

        <button class="lf-btn lf-btn--filled lf-btn--block" type="button">
          <span>초대 링크 공유하기</span><span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">share</span></span>
        </button>
        <button class="lf-btn lf-btn--outlined lf-btn--block" type="button">링크 복사하기</button>

        <div class="lf-stack lf-gap-3">
          <p class="lf-eyebrow lf-eyebrow--inset">상대방에게는 이렇게 보여요</p>
          <div class="lf-stack" aria-label="초대 링크 미리보기">
            <span class="lf-avatar lf-avatar--sm" aria-hidden="true">지</span>
            <div class="lf-card">
              <p class="lf-row-title">지우님이 새끼손가락을 내밀었어요!</p>
              <p class="lf-body">약속: 매주 화·목 아침 러닝 같이 하기</p>
              <p class="lf-caption">약속 확인하기</p>
            </div>
          </div>
        </div>

        <div class="lf-card lf-stack lf-gap-4">
          <div class="lf-countdown-card__row">
            <span class="lf-list-item__icon lf-list-item__icon--yellow" aria-hidden="true"><span class="material-symbols-rounded">schedule</span></span>
            <div class="lf-grow">
              <p class="lf-eyebrow">초대 남은 시간</p>
              <p class="lf-countdown" aria-label="71시간 59분 32초 남음">71:59:32</p>
            </div>
          </div>
          <div class="lf-progress" role="progressbar" aria-valuenow="99" aria-valuemin="0" aria-valuemax="100" aria-label="초대 남은 시간 남음">
            <span class="lf-progress__fill lf-invite-countdown__fill"></span>
          </div>
          <p class="lf-meta-line">링크는 1회용이에요 · 만료되면 아래에서 재발송할 수 있어요</p>
        </div>

      </div>

      <div class="lf-screen__actions">
        <button class="lf-btn lf-btn--outlined lf-btn--block" type="button" disabled>
          <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
          <span>재발송 — 만료 후 가능</span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
