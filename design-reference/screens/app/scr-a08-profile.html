<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A08 마이·신뢰 프로필 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A08" data-screen-name="마이·신뢰 프로필">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <h1 class="lf-appbar__title">마이</h1>
        <button class="lf-icon-button" type="button" aria-label="설정">
          <span class="material-symbols-rounded" aria-hidden="true">settings</span>
        </button>
      </header>

      <div class="lf-screen__body">

        <div class="lf-row lf-gap-5">
          <span class="lf-avatar lf-avatar--lg" aria-hidden="true">지</span>
          <div>
            <p class="lf-subtitle">지우</p>
            <p class="lf-caption">카카오 계정 연결됨</p>
          </div>
        </div>

        <!-- 약속 지킴율 (O-D3 표시명) — 완료·불이행 기반, 분쟁·무응답은 별도 표기하고 계산에서 제외 -->
        <div class="lf-trust-card">
          <div class="lf-ring">
            <svg class="lf-ring__chart" viewBox="0 0 88 88" role="img" aria-label="약속 지킴율 87퍼센트">
              <circle class="lf-ring__track" cx="44" cy="44" r="36"/>
              <circle class="lf-ring__fill lf-ring__fill--87" cx="44" cy="44" r="36"/>
            </svg>
            <span class="lf-ring__value" aria-hidden="true">87%</span>
          </div>
          <div class="lf-trust-card__stats">
            <p class="lf-trust-card__label">약속 지킴율</p>
            <p class="lf-trust-card__value">완료 7 · 불이행 1</p>
            <p class="lf-trust-card__note">의견 불일치 1 · 무응답 종결 1<br>— 지킴율 계산에서 제외돼요</p>
          </div>
        </div>

        <div class="lf-card">
          <ul class="lf-list">
            <li class="lf-list-item">
              <span class="lf-list-item__icon lf-list-item__icon--muted" aria-hidden="true">
                <span class="material-symbols-rounded">notifications</span>
              </span>
              <div class="lf-list-item__text">
                <div class="lf-list-item__headline" id="reminder-push-label">리마인드 알림</div>
                <div class="lf-list-item__supporting">D-7 · D-3 · D-1 · 디데이</div>
              </div>
              <button type="button" class="lf-switch" role="switch" aria-checked="true" aria-labelledby="reminder-push-label"></button>
            </li>
            <li class="lf-list-item">
              <span class="lf-list-item__icon lf-list-item__icon--muted" aria-hidden="true">
                <span class="material-symbols-rounded">mail</span>
              </span>
              <div class="lf-list-item__text">
                <div class="lf-list-item__headline" id="reminder-email-label">이메일 리마인드</div>
                <div class="lf-list-item__supporting">웹 참여 약속용 (선택)</div>
              </div>
              <button type="button" class="lf-switch" role="switch" aria-checked="false" aria-labelledby="reminder-email-label"></button>
            </li>
          </ul>
        </div>

        <div class="lf-card">
          <ul class="lf-list">
            <li>
              <button type="button" class="lf-row-link">
                <span class="material-symbols-rounded" aria-hidden="true">description</span>
                <span class="lf-row-link__label">이용약관 · 개인정보 처리방침</span>
                <span class="material-symbols-rounded lf-chevron" aria-hidden="true">chevron_right</span>
              </button>
            </li>
            <li>
              <button type="button" class="lf-row-link">
                <span class="material-symbols-rounded" aria-hidden="true">info</span>
                <span class="lf-row-link__label">서비스 안내 · 디스클레이머</span>
                <span class="material-symbols-rounded lf-chevron" aria-hidden="true">chevron_right</span>
              </button>
            </li>
          </ul>
        </div>

        <!-- 디스클레이머 — 문구 변경 금지 (요청서 §8) -->
        <p class="lf-disclaimer">리틀핑거의 약속 기록은 공증이나 전자계약 서비스가 아니며, 법적 효력을 보증하지 않습니다. 다만 양측의 승인 이력과 시각 정보는 분쟁 시 참고 자료로 활용될 수 있습니다.</p>

      </div>
    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
