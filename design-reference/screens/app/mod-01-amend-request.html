<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-01 변경·파기 요청 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="MOD-01" data-screen-name="변경·파기 요청">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <!-- 배경 — 약속 상세(SCR-A05) 화면이 흐릿하게 비치는 자리표시자. 실제 콘텐츠가 아니므로 스크린리더에서 숨김 -->
      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar">
          <button class="lf-icon-button" type="button" tabindex="-1" aria-label="뒤로가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          </button>
          <span class="lf-appbar__title">약속 상세</span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-row lf-gap-3">
            <span class="lf-chip lf-chip--sm lf-chip--mint">진행 중</span>
            <span class="lf-dday-circle lf-push-right">D-17</span>
          </div>
          <p class="lf-title">매주 화·목 아침 러닝 같이 하기</p>
          <div class="lf-backdrop__block lf-backdrop__block--accent lf-backdrop__block--120"></div>
          <div class="lf-backdrop__block lf-backdrop__block--60"></div>
        </div>
      </div>

      <div class="lf-scrim"></div>

      <div class="lf-sheet" role="dialog" aria-modal="true" aria-labelledby="mod01-title">
        <div class="lf-sheet__handle" aria-hidden="true"></div>
        <div class="lf-sheet__title-row">
          <h1 class="lf-sheet__title" id="mod01-title">변경·파기 요청</h1>
          <button class="lf-icon-button" type="button" aria-label="변경·파기 요청 닫기">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- F-11: 내용 변경 또는 파기 요청 중 선택 -->
        <div class="lf-segmented" role="tablist" aria-label="요청 종류">
          <button type="button" class="lf-segmented__item" role="tab" aria-selected="true">내용 변경</button>
          <button type="button" class="lf-segmented__item" role="tab" aria-selected="false">파기 요청</button>
        </div>

        <div class="lf-field">
          <label class="lf-field__label" for="amend-text">REASON · 무엇을 바꿀까요?</label>
          <textarea id="amend-text" class="lf-input lf-textarea">종료일을 8/25로 미루고 싶어. 휴가 기간(8/10–14)은 쉬는 걸로!</textarea>
        </div>

        <div class="lf-hint">
          <span class="material-symbols-rounded" aria-hidden="true">info</span>
          <span class="lf-hint__text">민준님이 승인해야 적용돼요 · 원본은 버전 이력에 남아요</span>
        </div>

        <button type="button" class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block">
          <span>요청 보내기</span>
          <span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">send</span></span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
