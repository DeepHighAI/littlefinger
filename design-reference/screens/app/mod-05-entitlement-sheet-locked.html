<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-05 혜택 시트 · 잠김 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- ADR 0015 (PO 2026-08-30): 혜택 시트의 잠김 상태. SDK 가 보상형 광고를 못 띄우면(플래그 off·no-fill·
     동의 거부·로드 시간 초과) 혜택은 잠기고 무료 대체 경로는 없다(D6) — 광고 버튼 자리에 잠김 문구만 남고
     구매 CTA 가 유일한 다른 길이다. 잠김은 모드와 무관하다: 이 파일은 RETENTION 모드(SCR-A05 보관 행의
     [보관 기간 늘리기])로 그렸고, DURATION 잠김도 제목·설명·현재 상태 줄만 mod-05-entitlement-sheet.html 의
     것으로 바뀐다. 재촉 문구 없음(§8). 문구 출처: promise-entitlement-labels.ts(ko). -->
<body class="lf-page" data-screen-id="MOD-05" data-screen-name="혜택 시트 · 잠김 (내 기록 보관)">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <!-- 배경 — 약속 상세(SCR-A05 COMPLETED) 화면이 비치는 자리표시자 -->
      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar">
          <button class="lf-icon-button" type="button" tabindex="-1" aria-label="뒤로가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          </button>
          <span class="lf-appbar__title">약속 상세</span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-row lf-gap-3">
            <span class="lf-chip lf-chip--sm lf-chip--mint">완료</span>
            <span class="lf-caption">2026-08-12 종결</span>
          </div>
          <p class="lf-title">매주 화·목 아침 러닝 같이 하기</p>
          <div class="lf-backdrop__block lf-backdrop__block--accent lf-backdrop__block--120"></div>
          <div class="lf-backdrop__block lf-backdrop__block--60"></div>
        </div>
      </div>

      <div class="lf-scrim"></div>

      <div class="lf-sheet" role="dialog" aria-modal="true" aria-labelledby="mod05-locked-title">
        <div class="lf-sheet__handle" aria-hidden="true"></div>

        <div class="lf-sheet__title-row">
          <h1 class="lf-sheet__title lf-grow" id="mod05-locked-title">내 기록 보관하기</h1>
          <button class="lf-icon-button" type="button" aria-label="닫기">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>

        <p class="lf-body--secondary">광고 1개를 보면 나에게 보이는 기록 보관 기간이 30일 늘어나요.</p>

        <!-- 내 보관 만료 — 종료일 다음 KST 자정이 기준, 무료 30일(D4). 참여자마다 다르다 -->
        <p class="lf-slot-sheet__usage">
          <span class="material-symbols-rounded" aria-hidden="true">inventory_2</span>
          <span>현재 내 보관 만료 ·</span>
          <span>2026-09-11 00:00</span>
        </p>

        <!-- 광고 버튼이 있던 자리 — 잠김은 텍스트로만 말하고 빈 버튼을 남기지 않는다 -->
        <div class="lf-card lf-card--muted lf-card--flat lf-info-row">
          <span class="material-symbols-rounded" aria-hidden="true">lock</span>
          <p class="lf-caption">지금은 광고를 볼 수 없어 잠겨 있어요.</p>
        </div>

        <div class="lf-slot-sheet__offer">
          <p class="lf-slot-sheet__offer-title">영구 보관</p>
          <p class="lf-caption">이 약속을 내 계정에 영구 보관해요. 작성자가 구매하면 종료일 없는 약속도 제안할 수 있어요.</p>
          <!-- 가격은 Google Play 현지화 가격이 정본 — ₩2,000 은 표시 폴백 -->
          <button type="button" class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block">
            <span>₩2,000에 영구 보관</span>
            <span class="lf-btn__trailing lf-btn__trailing--plain"><span class="material-symbols-rounded" aria-hidden="true">inventory_2</span></span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
