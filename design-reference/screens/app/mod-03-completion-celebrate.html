<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-03 완료 축하 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="MOD-03" data-screen-name="완료 축하">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <!-- 배경 — 홈·약속 목록 화면이 흐릿하게 비치는 자리표시자. 실제 콘텐츠가 아니므로 스크린리더에서 숨김 -->
      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar lf-appbar--brand">
          <svg class="lf-pinky lf-pinky--sm" viewBox="0 0 120 120" aria-hidden="true">
            <path class="lf-pinky__left"  d="M40 14 L40 62 A21 21 0 0 0 82 62 L82 50"/>
            <path class="lf-pinky__right" d="M80 106 L80 58 A21 21 0 0 0 38 58 L38 70"/>
          </svg>
          <span class="lf-appbar__title">리틀핑거</span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-backdrop__block lf-backdrop__block--accent lf-backdrop__block--96"></div>
          <div class="lf-backdrop__block lf-backdrop__block--88"></div>
          <div class="lf-backdrop__block lf-backdrop__block--88"></div>
        </div>
      </div>

      <div class="lf-scrim"></div>

      <!-- COMPLETED 전환 순간의 축하 시트 -->
      <div class="lf-sheet lf-sheet--celebrate" role="dialog" aria-modal="true" aria-labelledby="mod03-title">
        <div class="lf-sheet__handle" aria-hidden="true"></div>
        <svg class="lf-pinky lf-pinky--xl lf-pinky--on-container lf-pinky--hooked" viewBox="0 0 120 120" role="img" aria-label="새끼손가락 걸기">
          <path class="lf-pinky__left"  d="M40 14 L40 62 A21 21 0 0 0 82 62 L82 50"/>
          <path class="lf-pinky__right" d="M80 106 L80 58 A21 21 0 0 0 38 58 L38 70"/>
        </svg>
        <h1 class="lf-title" id="mod03-title">약속 지킴! 축하해요</h1>
        <p class="lf-body--secondary">매주 화·목 아침 러닝 같이 하기 — 완주!<br>민준님과 하이파이브 하세요</p>
        <p class="lf-stat-change">
          <span class="material-symbols-rounded" aria-hidden="true">trending_up</span>
          <span>약속 지킴율 87% → 89%</span>
        </p>
        <button type="button" class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block">새 약속 만들기</button>
        <button type="button" class="lf-text-action">공유하기</button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
