<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>닉네임 변경 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/base.css"><link rel="stylesheet" href="../../styles/components.css"><link rel="stylesheet" href="../../styles/screens/app-support.css"><link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-NICKNAME" data-screen-name="닉네임 변경">
<div class="lf-device"><div class="lf-device__viewport"><div class="lf-screen">
  <header class="lf-appbar"><button class="lf-icon-button" type="button" aria-label="뒤로"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span></button><h1 class="lf-appbar__title">닉네임 변경</h1></header>
  <div class="lf-screen__body">
    <div class="lf-card lf-stack lf-gap-5">
      <div class="lf-field"><label class="lf-field__label" for="nickname">NICKNAME · 닉네임 <span class="lf-eyebrow__required">필수</span></label><input class="lf-input" id="nickname" value="지우"><p class="lf-field__hint">약속 상대와 증인에게 보이는 이름이에요 · 2–12자</p></div>
      <div class="lf-card lf-card--yellow lf-card--flat lf-info-row"><img class="lf-mascot lf-mascot--md" src="../../assets/images/mascot-face-e1.png" alt=""><p class="lf-body lf-body--sm">따뜻하고 알아보기 쉬운 이름을 써 주세요.</p></div>
    </div>
  </div>
  <div class="lf-screen__actions"><button class="lf-btn lf-btn--filled lf-btn--block" type="button"><span>저장하기</span><span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button></div>
</div></div></div>
<script src="../frame.js"></script>
</body>
</html>
