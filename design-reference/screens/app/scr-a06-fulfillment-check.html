<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A06 이행 확인 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-create.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4j (2026-09-03): 큰 선택 카드 · 선택 = 옐로 스티커. 증빙 사진은 선택, 최대 3장 (EVIDENCE_MAX_COUNT). -->
<body class="lf-page" data-screen-id="SCR-A06" data-screen-name="이행 확인 입력">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">이행 확인</h1>
        <span class="lf-appbar__spacer"></span>
      </header>

      <div class="lf-screen__body">

        <div class="lf-card lf-card--flat">
          <p class="lf-card__title">매주 화·목 아침 러닝 같이 하기</p>
          <p class="lf-card__meta">종료일 8/11 (화) 지남 · 지킬 사람 둘 다</p>
        </div>

        <div class="lf-fulfillment__question">
          <h2 class="lf-title">약속, 지켜졌나요?</h2>
          <p>상대방에게도 같은 질문이 가요</p>
        </div>

        <fieldset class="lf-answer-list">
          <legend class="lf-sr-only">이행 결과</legend>
          <button class="lf-answer" type="button" aria-pressed="true">
            <span class="material-symbols-rounded lf-answer__icon" aria-hidden="true">check_circle</span>
            <span class="lf-answer__text">
              <span class="lf-answer__title">지켰어요</span>
              <span class="lf-answer__subtitle">뿌듯한 쪽</span>
            </span>
            <span class="material-symbols-rounded lf-answer__indicator" aria-hidden="true">radio_button_checked</span>
          </button>
          <button class="lf-answer" type="button" aria-pressed="false">
            <span class="material-symbols-rounded lf-answer__icon" aria-hidden="true">cancel</span>
            <span class="lf-answer__text">
              <span class="lf-answer__title">안 지켜졌어요</span>
              <span class="lf-answer__subtitle">솔직한 쪽</span>
            </span>
            <span class="material-symbols-rounded lf-answer__indicator" aria-hidden="true">radio_button_unchecked</span>
          </button>
        </fieldset>

        <div class="lf-stack lf-gap-3">
          <p class="lf-eyebrow lf-eyebrow--inset">PROOF · 증빙 사진 <span class="lf-field__optional">선택</span></p>
          <div class="lf-proof-row">
            <div class="lf-proof lf-proof--thumb">
              <span class="material-symbols-rounded" aria-hidden="true">image</span>
              <span class="lf-proof__filename">러닝 인증.jpg</span>
              <button class="lf-proof__remove" type="button" aria-label="러닝 인증.jpg 삭제">
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
              </button>
            </div>
            <button class="lf-proof lf-proof--thumb lf-proof--dashed" type="button">
              <span class="material-symbols-rounded" aria-hidden="true">photo_camera</span>
              <span class="lf-proof__filename">사진 추가</span>
            </button>
          </div>
          <p class="lf-proof-hint">상대와 증인에게 공개돼요</p>
        </div>

        <div class="lf-card lf-card--flat lf-partner-status">
          <span class="lf-avatar lf-avatar--sm lf-avatar--pending" aria-hidden="true">?</span>
          <p class="lf-partner-status__text">상대방은 아직 답하지 않았어요</p>
          <span class="material-symbols-rounded lf-partner-status__icon" aria-hidden="true">hourglass_empty</span>
        </div>

      </div>

      <div class="lf-screen__actions lf-screen__actions--end">
        <button class="lf-btn lf-btn--filled lf-btn--cta" type="button">
          <span>제출</span>
          <span class="lf-btn__trailing lf-btn__trailing--plain"><span class="material-symbols-rounded" aria-hidden="true">check</span></span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
