<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-04 슬롯 결제 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4o (2026-09-03): 재촉 없는 결제 시트 · 규칙만 서술 (ADR 0009). 가격은 서버가 준 문자열을 그대로 쓴다. -->
<body class="lf-page" data-screen-id="MOD-04" data-screen-name="슬롯 결제">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar">
          <span class="lf-icon-button"><span class="material-symbols-rounded">close</span></span>
          <h1 class="lf-appbar__title">약속 만들기</h1>
          <span class="lf-appbar__spacer"></span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-backdrop__block lf-backdrop__block--120"></div>
          <div class="lf-backdrop__block lf-backdrop__block--96"></div>
          <div class="lf-backdrop__block lf-backdrop__block--60"></div>
        </div>
      </div>

      <div class="lf-scrim" aria-hidden="true"></div>

      <div class="lf-sheet" role="dialog" aria-modal="true" aria-labelledby="slot-title">
        <span class="lf-sheet__handle" aria-hidden="true"></span>
        <div class="lf-sheet__title-row">
          <h2 class="lf-sheet__title" id="slot-title">약속 슬롯</h2>
          <button class="lf-icon-button" type="button" aria-label="닫기">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- 발송이 막혀 열린 경우의 안내 — 핑크(응답 필요) flat 카드 -->
        <p class="lf-slot-sheet__notice">지금은 슬롯이 가득 차 있어요. 슬롯을 추가하면 바로 보낼 수 있어요.</p>

        <p class="lf-slot-sheet__usage">
          <span class="material-symbols-rounded" aria-hidden="true">bookmark</span>
          <span>사용 중 5 / 5</span>
        </p>
        <p class="lf-slot-sheet__rule">진행 중인 약속은 슬롯을 하나씩 사용해요. 약속이 종결되면 슬롯은 다시 비워져요.</p>

        <div class="lf-slot-sheet__offer">
          <p class="lf-slot-sheet__offer-title">슬롯 1개 추가</p>
          <p class="lf-slot-sheet__offer-meta">한 번 구매하면 영구히 유지돼요.</p>
        </div>

        <button class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block" type="button">
          <span>₩1,000에 추가하기</span>
          <span class="lf-btn__trailing lf-btn__trailing--plain"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
