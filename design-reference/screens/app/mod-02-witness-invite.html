<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOD-02 증인 초대 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- ADR 0015 D1 (PO 2026-08-30): 증인 자리는 초대하는 역할에 속한다 — 작성자 무료 1 + 광고 1, 상대방 광고 1,
     약속 전체 최대 3명(WITNESS_MAX). 이 파일은 작성자 시점: 무료 자리는 하영이 쓰고 있고 광고 자리는 아직 잠겨 있다.
     칩 "증인 1 / 2" 는 (약속 전체 사용 중 / 현재 열린 자리 합계)다 — 작성자 1 + 상대방 0 이면 1, 상대방이 광고로
     열면 2 가 된다. 광고를 볼 수 없으면 자리는 잠긴 채 남고 무료 대체 경로는 없다(D6).
     상대방 시점은 자리 0 이라 첫 행 없이 "내 증인 자리는 아직 잠겨 있어요. 광고를 보면 한 자리가 열려요." 만 보인다.
     문구 출처: mod-02-labels.ts(ko). -->
<body class="lf-page" data-screen-id="MOD-02" data-screen-name="증인 초대">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <!-- 배경 — 약속 상세(SCR-A05) 화면이 흐릿하게 비치는 자리표시자. 실제 콘텐츠가 아니므로 스크린리더에서 숨김 -->
      <div class="lf-backdrop" aria-hidden="true">
        <header class="lf-appbar">
          <button class="lf-icon-button lf-icon-button--strong" type="button" tabindex="-1" aria-label="뒤로가기">
            <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          </button>
          <span class="lf-appbar__title">약속 상세</span>
        </header>
        <div class="lf-backdrop__body">
          <div class="lf-row lf-gap-3">
            <span class="lf-chip lf-chip--status">진행 중</span>
            <span class="lf-dday lf-dday--lg lf-push-right">D-17</span>
          </div>
          <p class="lf-title">매주 화·목 아침 러닝 같이 하기</p>
          <div class="lf-backdrop__block lf-backdrop__block--accent lf-backdrop__block--120"></div>
        </div>
      </div>

      <div class="lf-scrim"></div>

      <div class="lf-sheet" role="dialog" aria-modal="true" aria-labelledby="mod02-title">
        <div class="lf-sheet__handle" aria-hidden="true"></div>

        <div class="lf-row lf-gap-3">
          <h1 class="lf-sheet__title lf-grow" id="mod02-title">증인 초대</h1>
          <span class="lf-chip lf-chip--neutral">증인 1 / 2</span>
          <button class="lf-icon-button" type="button" aria-label="증인 초대 닫기">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>
        <p class="lf-caption">약속을 지켜봐 줄 사람을 불러요 (최대 3명)</p>

        <!-- F-05 · 작성자 자리 2개: 무료 1(사용 중) + 광고 1(잠김).
             "무료 1"·"광고 1 · 잠김" 자리 태그는 기준선 주석용 표기다 — 출시본(RN)은 칩 카운트와 캡션만 보여 준다. PO 확인 필요 -->
        <ul class="lf-stack lf-gap-3">
          <li class="lf-witness">
            <span class="lf-avatar" aria-hidden="true">하</span>
            <div class="lf-witness__body">
              <p class="lf-witness__name">하영</p>
              <p class="lf-witness__meta">2026. 7. 24. 18:03 확인 서명 · 무료 1</p>
            </div>
            <span class="lf-chip lf-chip--signed">확인 완료</span>
          </li>

          <!-- 잠긴 자리 — 자물쇠 + "잠김" 텍스트, 해제 CTA 는 행 안에 붙는다 -->
          <li class="lf-witness lf-witness-slot--locked">
            <div class="lf-row lf-gap-5">
              <span class="lf-witness__avatar--empty" aria-hidden="true">
                <span class="material-symbols-rounded">lock</span>
              </span>
              <div class="lf-witness__body">
                <p class="lf-witness__empty-label">지금 사용할 수 있는 증인 자리를 모두 사용했어요.</p>
                <p class="lf-witness__meta">광고 1 · 잠김</p>
              </div>
            </div>
            <button type="button" class="lf-btn lf-btn--outlined lf-btn--block">광고 보고 증인 1명 추가</button>
          </li>
        </ul>

        <div class="lf-hint">
          <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
          <span class="lf-hint__text">증인은 내용을 확인만 해요 — 판정 권한은 없어요</span>
        </div>

        <!-- 카카오 공식 버튼 가이드 형태 플레이스홀더 (요청서 §8). 열린 자리가 모두 차면 비활성 -->
        <button type="button" class="lf-btn lf-btn--kakao lf-btn--cta lf-btn--block" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.4.3.7.6.5l4.1-2.7c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/>
          </svg>
          <span>카카오톡으로 증인 초대하기</span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
