<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A00 온보딩 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-entry.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4a (2026-09-03): 블롭 히어로 + 큰 헤드라인. 3단계 아이콘 행은 확정안에 없어 뺐다. -->
<body class="lf-page" data-screen-id="SCR-A00" data-screen-name="온보딩 1/3">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <div class="lf-onboarding__top">
        <span class="lf-onboarding__brand">
          <img class="lf-mascot" src="../../assets/images/mascot-face-e1.png" alt="">
          <span>리틀핑거</span>
        </span>
        <button class="lf-onboarding__skip" type="button">건너뛰기</button>
      </div>

      <!-- 히어로 블롭 — 흰 블롭 + 옐로 블롭, 눈은 검은 손 루프 -->
      <div class="lf-blob lf-blob--hero lf-blob--tilt" aria-hidden="true">
        <svg class="lf-blob__svg" viewBox="0 0 330 290">
          <path class="lf-blob__paper" d="M120 40c60-30 130 10 140 70s-20 120-90 120S30 210 30 150 60 70 120 40Z"/>
          <path class="lf-blob__yellow" d="M200 160c40-20 100 0 110 40s-10 80-60 80-70-20-90-50 0-50 40-70Z"/>
        </svg>
        <div class="lf-blob__eyes">
          <span class="lf-pinky-loop lf-pinky-loop--eyes">
            <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
            <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
            <span class="lf-pinky-loop__spark"></span>
          </span>
        </div>
      </div>

      <div class="lf-onboarding__copy">
        <h1 class="lf-display">약속하고,<br>걸고,<br>지키는 재미.</h1>
        <p class="lf-onboarding__subcopy">둘이 정한 약속을 기록하고 잊지 않게 챙겨드려요.<br>작성 → 카톡 초대 → 새끼손가락 걸기, 세 단계면 끝.</p>
      </div>

      <div class="lf-onboarding__spacer"></div>

      <div class="lf-onboarding__bottom">
        <div class="lf-onboarding__dots" role="img" aria-label="온보딩 1/3">
          <span class="lf-onboarding__dot lf-onboarding__dot--active"></span>
          <span class="lf-onboarding__dot"></span>
          <span class="lf-onboarding__dot"></span>
        </div>
        <button class="lf-btn lf-btn--filled lf-btn--cta" type="button">
          <span>시작하기</span>
          <span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
