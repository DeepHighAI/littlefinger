<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A00 온보딩 1/3 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-entry.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A00" data-screen-name="온보딩 1/3">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <div class="lf-onboarding__skip-row">
        <button class="lf-onboarding__skip" type="button">건너뛰기</button>
      </div>

      <div class="lf-screen__body lf-screen__body--centered lf-onboarding__body">

        <div class="lf-onboarding__badge">
          <svg class="lf-pinky lf-pinky--xl lf-pinky--hooked" viewBox="0 0 120 120" role="img" aria-label="새끼손가락 걸기">
            <path class="lf-pinky__left"  d="M40 14 L40 62 A21 21 0 0 0 82 62 L82 50"/>
            <path class="lf-pinky__right" d="M80 106 L80 58 A21 21 0 0 0 38 58 L38 70"/>
          </svg>
        </div>

        <div>
          <h1 class="lf-headline">약속하고, 걸고,<br>지키는 재미</h1>
          <p class="lf-onboarding__subcopy">둘이 정한 약속을 기록하고<br>잊지 않게 챙겨드려요</p>
        </div>

        <!-- 핵심 루프 요약: 작성 → 카톡 초대 → 걸고 지키기 -->
        <ol class="lf-onboarding__steps">
          <li class="lf-onboarding__step">
            <span class="lf-onboarding__step-icon">
              <span class="material-symbols-rounded" aria-hidden="true">edit</span>
            </span>
            <span class="lf-onboarding__step-label">작성</span>
          </li>
          <li class="lf-onboarding__arrow" aria-hidden="true">
            <span class="material-symbols-rounded">east</span>
          </li>
          <li class="lf-onboarding__step">
            <span class="lf-onboarding__step-icon">
              <span class="material-symbols-rounded" aria-hidden="true">forum</span>
            </span>
            <span class="lf-onboarding__step-label">카톡 초대</span>
          </li>
          <li class="lf-onboarding__arrow" aria-hidden="true">
            <span class="material-symbols-rounded">east</span>
          </li>
          <li class="lf-onboarding__step">
            <span class="lf-onboarding__step-icon">
              <svg class="lf-pinky lf-pinky--xs" viewBox="0 0 120 120" aria-hidden="true">
                <path class="lf-pinky__left"  d="M40 14 L40 62 A21 21 0 0 0 82 62 L82 50"/>
                <path class="lf-pinky__right" d="M80 106 L80 58 A21 21 0 0 0 38 58 L38 70"/>
              </svg>
            </span>
            <span class="lf-onboarding__step-label">걸고 지키기</span>
          </li>
        </ol>

        <div class="lf-onboarding__dots" role="img" aria-label="1/3 단계">
          <span class="lf-onboarding__dot lf-onboarding__dot--active"></span>
          <span class="lf-onboarding__dot"></span>
          <span class="lf-onboarding__dot"></span>
        </div>

      </div>

      <div class="lf-screen__actions lf-screen__actions--plain">
        <button class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block" type="button">시작하기</button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
