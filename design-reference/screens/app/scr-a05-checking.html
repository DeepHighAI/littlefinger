<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A05 / CHECKING 이행 확인 중 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-detail.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A05 / CHECKING" data-screen-name="이행 확인 중">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button lf-icon-button--strong" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">약속 상세</h1>
        <button class="lf-icon-button" type="button" aria-label="더보기">
          <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
        </button>
      </header>

      <div class="lf-screen__body">

        <div class="lf-row lf-gap-3">
          <span class="lf-chip lf-chip--urgent">이행 확인 중</span>
          <span class="lf-caption">종료일 지남 · 응답 기한 8/18</span>
        </div>

        <h2 class="lf-title">매주 화·목 아침 러닝 같이 하기</h2>

        <div class="lf-stamp lf-stamp--compact">
          <p class="lf-stamp__headline">약속, 지켜졌나요?</p>
          <p class="lf-stamp__time">두 사람 모두 답하면 결과가 기록돼요</p>
        </div>

        <div class="lf-card">
          <ul class="lf-list">
            <li class="lf-list-item">
              <span class="lf-avatar lf-avatar--a">지</span>
              <div class="lf-list-item__text">
                <p class="lf-list-item__headline">내 응답</p>
                <p class="lf-list-item__supporting">오늘 10:02 제출</p>
              </div>
              <span class="lf-result lf-result--kept">
                <span class="material-symbols-rounded" aria-hidden="true">check</span>
                <span>지켰어요</span>
              </span>
            </li>
            <li class="lf-list-item">
              <span class="lf-avatar lf-avatar--b">민</span>
              <div class="lf-list-item__text">
                <p class="lf-list-item__headline">민준님 응답</p>
                <p class="lf-list-item__supporting">아직 답하지 않았어요</p>
              </div>
              <span class="material-symbols-rounded lf-icon-muted" aria-hidden="true">hourglass_empty</span>
            </li>
          </ul>
        </div>

        <div>
          <p class="lf-section-title">내 증빙 (선택)</p>
          <div class="lf-stack lf-gap-2">
            <div class="lf-row lf-gap-3">
              <div class="lf-photo">
                <span class="material-symbols-rounded" aria-hidden="true">image</span>
                <span class="lf-photo__caption">러닝 인증.jpg</span>
              </div>
              <button class="lf-photo lf-photo--add" type="button" aria-label="증빙 사진 추가">
                <span class="material-symbols-rounded" aria-hidden="true">add</span>
                <span class="lf-photo__caption">추가</span>
              </button>
            </div>
            <p class="lf-caption">상대와 증인에게 공개돼요</p>
          </div>
        </div>

        <p class="lf-note">기한 내 무응답이면 "미확정 종결"로 기록돼요 · 리마인드를 계속 보내드릴게요</p>

      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
