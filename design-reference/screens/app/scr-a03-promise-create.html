<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A03 약속 작성 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-create.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4c (2026-09-03): 소문자 섹션 라벨(eyebrow) · 파스텔 선택 칩 · 보상/벌칙 스티커.
     PO 보정(2026-09-04): 고정 영역은 앱바와 3단계 진행 표시만 두고, 단계 제목 반복을 제거해 입력 영역을 넓힌다. -->
<body class="lf-page" data-screen-id="SCR-A03" data-screen-name="약속 작성">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button" type="button" aria-label="닫기">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <h1 class="lf-appbar__title">약속 만들기</h1>
        <span class="lf-chip lf-chip--sm lf-chip--yellow">작성 중</span>
      </header>

      <div class="lf-wizard" role="img" aria-label="1/3 단계 · 내용">
        <span class="lf-wizard__step lf-wizard__step--active"></span>
        <span class="lf-wizard__step"></span>
        <span class="lf-wizard__step"></span>
        <span class="lf-wizard__label">1/3 · 내용</span>
      </div>

      <form class="lf-screen__body lf-create__body" action="#">

        <section class="lf-card lf-create__section" aria-label="내용">
          <div class="lf-field">
            <label class="lf-field__label" for="title">TITLE · 제목</label>
            <input class="lf-input" id="title" type="text" value="매주 화·목 아침 러닝 같이 하기">
          </div>
          <div class="lf-field">
            <label class="lf-field__label" for="content">CONTENT · 내용</label>
            <textarea class="lf-input lf-textarea" id="content">8월 11일까지 매주 화·목 아침 7시, 반포한강공원에서 함께 러닝한다. 우천 시 다음 날로 순연.</textarea>
          </div>
          <fieldset class="lf-field">
            <legend class="lf-field__label">CATEGORY · 카테고리 <span class="lf-field__optional">선택</span></legend>
            <div class="lf-choices">
              <button class="lf-choice" type="button" aria-pressed="true">습관</button>
              <button class="lf-choice" type="button" aria-pressed="false">내기</button>
              <button class="lf-choice" type="button" aria-pressed="false">금전</button>
              <button class="lf-choice" type="button" aria-pressed="false">기타</button>
            </div>
          </fieldset>
        </section>

        <section class="lf-card lf-create__section" aria-label="조건">
          <div class="lf-field">
            <span class="lf-field__label" id="end-date-label">END DATE · 종료일 <span class="lf-field__required">필수</span></span>
            <button class="lf-picker" type="button" aria-labelledby="end-date-label">
              <span class="material-symbols-rounded" aria-hidden="true">event</span>
              <span class="lf-picker__value">2026-08-11 (화)</span>
              <span class="material-symbols-rounded lf-picker__chevron" aria-hidden="true">expand_more</span>
            </button>
            <p class="lf-create__hint">새 약속은 만든 날부터 30일까지 무료예요. 더 긴 기간은 보상형 광고 또는 영구 보관으로 열 수 있어요.</p>
          </div>
          <fieldset class="lf-field">
            <legend class="lf-field__label">WHO · 지킬 사람</legend>
            <div class="lf-choices">
              <button class="lf-choice" type="button" aria-pressed="false">나</button>
              <button class="lf-choice" type="button" aria-pressed="false">상대</button>
              <button class="lf-choice" type="button" aria-pressed="true">둘 다</button>
            </div>
          </fieldset>
        </section>

        <div class="lf-outcomes">
          <div class="lf-outcome lf-outcome--reward">
            <p class="lf-outcome__label">REWARD · 보상</p>
            <p class="lf-outcome__value">성공하면 오마카세 사주기</p>
          </div>
          <div class="lf-outcome lf-outcome--penalty">
            <p class="lf-outcome__label">PENALTY · 벌칙</p>
            <p class="lf-outcome__value">커피 셔틀</p>
          </div>
        </div>

      </form>

      <div class="lf-screen__actions lf-screen__actions--end">
        <button class="lf-btn lf-btn--filled lf-btn--cta" type="button">
          <span>상대에게 보내기</span>
          <span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">send</span></span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
