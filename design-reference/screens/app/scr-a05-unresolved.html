<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A05 / UNRESOLVED 미확정 종결 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-detail.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A05 / UNRESOLVED" data-screen-name="미확정 종결">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button lf-icon-button--strong" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">약속 상세</h1>
        <button class="lf-icon-button" type="button" aria-label="더보기">
          <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
        </button>
      </header>

      <div class="lf-screen__body">

        <div class="lf-row lf-gap-3">
          <span class="lf-chip lf-chip--neutral">미확정 종결</span>
          <span class="lf-caption">2026-08-08 종결</span>
        </div>

        <h2 class="lf-title">주 3회 홈트 인증하기</h2>

        <div class="lf-stamp lf-stamp--compact lf-stamp--neutral">
          <span class="material-symbols-rounded lf-stamp__icon" aria-hidden="true">hourglass_bottom</span>
          <p class="lf-stamp__headline">응답 없이 종료됐어요</p>
          <p class="lf-stamp__time">응답 기한(7일) 동안 민준님의<br>이행 확인이 없었어요</p>
        </div>

        <ul class="lf-list lf-gap-3">
          <li class="lf-compare__item lf-row lf-gap-3">
            <span class="lf-avatar lf-avatar--a">지</span>
            <span class="lf-body--secondary lf-grow">지우 · 지켰어요 (8/1 09:12)</span>
            <span class="material-symbols-rounded lf-icon-reward" aria-hidden="true">check</span>
          </li>
          <li class="lf-compare__item lf-row lf-gap-3">
            <span class="lf-avatar lf-avatar--muted">민</span>
            <span class="lf-caption lf-grow">민준 · 무응답 (리마인드 4회 발송)</span>
            <span class="material-symbols-rounded lf-icon-muted" aria-hidden="true">notifications_off</span>
          </li>
        </ul>

        <!-- 약속 지킴율에서 제외, 별도 건수로 표기 (§6) -->
        <p class="lf-note">약속 지킴율에는 반영되지 않아요 · 프로필에 "무응답 종결"로 별도 표기돼요</p>

      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
