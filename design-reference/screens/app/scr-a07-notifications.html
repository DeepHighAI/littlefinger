<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A07 알림함 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-support.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<!-- 확정안 4k (2026-09-03): 읽지 않음 = 옐로 카드 · 유형별 파스텔 아이콘 원.
     확정안의 광고 점선 플레이스홀더는 갤러리에만 둔다 — 앱은 비활성이면 그리지 않는다 (ADR 0009). -->
<body class="lf-page" data-screen-id="SCR-A07" data-screen-name="알림함">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">알림</h1>
        <button class="lf-text-action" type="button">모두 읽음</button>
      </header>

      <div class="lf-screen__body">

        <section class="lf-notif-section lf-stack lf-gap-4" aria-label="오늘">
          <p class="lf-eyebrow">TODAY · 오늘</p>
          <ul class="lf-list">
            <li>
              <button class="lf-list-item lf-list-item--unread" type="button">
                <span class="lf-list-item__icon" aria-hidden="true"><img class="lf-eyes lf-eyes--row" src="../../assets/images/eyes-e1.png" alt=""></span>
                <span class="lf-list-item__text">
                  <span class="lf-list-item__headline">민준님이 손가락 걸었어요! 약속 성립</span>
                  <span class="lf-list-item__supporting">매주 화·목 아침 러닝 같이 하기 · 방금</span>
                </span>
                <span class="lf-list-item__dot" aria-hidden="true"></span>
                <span class="lf-sr-only">읽지 않음</span>
              </button>
            </li>
            <li>
              <button class="lf-list-item lf-list-item--unread" type="button">
                <span class="lf-list-item__icon lf-list-item__icon--pink" aria-hidden="true"><span class="material-symbols-rounded">notification_important</span></span>
                <span class="lf-list-item__text">
                  <span class="lf-list-item__headline">지켜졌나요? 이행 확인이 필요해요</span>
                  <span class="lf-list-item__supporting">월급날까지 배달앱 금지 · 2시간 전</span>
                </span>
                <span class="lf-list-item__dot" aria-hidden="true"></span>
                <span class="lf-sr-only">읽지 않음</span>
              </button>
            </li>
          </ul>
        </section>

        <section class="lf-notif-section lf-stack lf-gap-4" aria-label="어제">
          <p class="lf-eyebrow">YESTERDAY · 어제</p>
          <ul class="lf-list">
            <li>
              <button class="lf-list-item" type="button">
                <span class="lf-list-item__icon lf-list-item__icon--cream" aria-hidden="true"><span class="material-symbols-rounded">alarm</span></span>
                <span class="lf-list-item__text">
                  <span class="lf-list-item__headline">리마인드 D-3 — 곧 종료일이에요</span>
                  <span class="lf-list-item__supporting">월말까지 야식 끊기 · 어제 09:00</span>
                </span>
              </button>
            </li>
            <li>
              <button class="lf-list-item" type="button">
                <span class="lf-list-item__icon lf-list-item__icon--sky" aria-hidden="true"><span class="material-symbols-rounded">sync_alt</span></span>
                <span class="lf-list-item__text">
                  <span class="lf-list-item__headline">민준님이 변경을 요청했어요</span>
                  <span class="lf-list-item__supporting">종료일 8/11 → 8/25 · 어제 20:14</span>
                </span>
              </button>
            </li>
            <li>
              <button class="lf-list-item" type="button">
                <span class="lf-list-item__icon lf-list-item__icon--mint" aria-hidden="true"><span class="material-symbols-rounded">draw</span></span>
                <span class="lf-list-item__text">
                  <span class="lf-list-item__headline">하영님이 증인 서명을 완료했어요</span>
                  <span class="lf-list-item__supporting">매주 화·목 아침 러닝 · 어제 18:03</span>
                </span>
              </button>
            </li>
          </ul>
        </section>

        <!-- 하단 네이티브 광고 슬롯 — 갤러리에서만 자리를 표시 (F-12 확대, PO 2026-08-24) -->
        <div class="lf-ad-slot">
          <span class="material-symbols-rounded" aria-hidden="true">ads_click</span>
          <span>광고 자리 · MVP에서는 비활성</span>
        </div>

      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
