<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-W03 승인 완료 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/web.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-W03" data-screen-name="승인 완료">

<div class="lf-device">
  <div class="lf-device__viewport">

    <!-- 카톡 인앱 브라우저에서 열리는 화면. 광고 금지, 주 CTA 1개(앱에서 계속하기). -->
    <div class="lf-screen">

      <div class="lf-browserbar">
        <button class="lf-icon-button" type="button" aria-label="닫기">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <div class="lf-browserbar__identity">
          <span class="lf-browserbar__name">리틀핑거</span>
          <span class="lf-browserbar__host">promise.littlefinger.app</span>
        </div>
        <button class="lf-icon-button" type="button" aria-label="더보기">
          <span class="material-symbols-rounded" aria-hidden="true">more_horiz</span>
        </button>
      </div>

      <div class="lf-screen__body lf-screen__body--web">

        <!-- 확정 스탬프 — "제대로 기록됐다"는 신뢰감 (요청서 §8) -->
        <div class="lf-stamp lf-stamp--completed">
          <svg class="lf-blob--corner lf-blob--corner-left" viewBox="0 0 90 70" aria-hidden="true"><path class="lf-blob__soft-mint" d="M40 6c22-10 50 6 46 30S60 68 36 66 4 50 8 32 22 14 40 6Z"/></svg>
          <span class="lf-stamp__pill" aria-hidden="true">
            <span class="lf-pinky-loop lf-pinky-loop--sm">
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-color.png" alt=""></span>
              <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-color.png" alt=""></span>
              <span class="lf-pinky-loop__spark"></span>
            </span>
          </span>
          <h1 class="lf-stamp__headline">딱! 약속이 성립됐어요</h1>
          <p class="lf-stamp__time">2026-07-12 21:04 확정</p>
          <div class="lf-stamp__approvals">
            <span class="lf-approval">
              <span class="lf-approval__dot" aria-hidden="true"></span>지우 20:58
            </span>
            <span class="lf-approval">
              <span class="lf-approval__dot" aria-hidden="true"></span>민준 21:04
            </span>
          </div>
          <!-- 기록 지문 (Q-4) — 모든 확정 영역에 노출 -->
          <p class="lf-fingerprint">RECORD · <span class="lf-fingerprint__code">A3F9-77C2-01</span></p>
        </div>

        <!-- 디스클레이머 — 문구 변경 금지 (요청서 §8) -->
        <p class="lf-disclaimer">리틀핑거의 약속 기록은 공증이나 전자계약 서비스가 아니며, 법적 효력을 보증하지 않습니다. 다만 양측의 승인 이력과 시각 정보는 분쟁 시 참고 자료로 활용될 수 있습니다.</p>

        <div class="lf-card lf-card--web lf-card--flat lf-app-hint">
          <img class="lf-mascot lf-mascot--lg" src="../../assets/images/mascot-face-e1.png" alt="">
          <p class="lf-app-hint__text">앱에서는 푸시로<br>약속을 챙겨드려요</p>
        </div>

      </div>

      <div class="lf-screen__actions lf-screen__actions--web">
        <button class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block" type="button"><span>앱에서 계속하기</span><span class="lf-btn__trailing"><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></span></button>
        <button class="lf-btn-link" type="button">웹으로 볼게요</button>
      </div>

    </div>
  </div>
</div>

<script src="../frame.js"></script>
</body>
</html>
