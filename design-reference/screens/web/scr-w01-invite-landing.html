<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-W01 초대 랜딩 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/web.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-W01" data-screen-name="초대 랜딩">

<div class="lf-device">
  <div class="lf-device__viewport">

    <!-- 카톡 인앱 브라우저에서 열리는 화면. 광고 금지, 주 CTA 1개. -->
    <div class="lf-screen">

      <div class="lf-browserbar">
        <button class="lf-icon-button" type="button" aria-label="닫기">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <div class="lf-browserbar__identity">
          <span class="lf-browserbar__name">리틀핑거</span>
          <span class="lf-browserbar__host">promise.littlefinger.app</span>
        </div>
        <button class="lf-icon-button" type="button" aria-label="더보기">
          <span class="material-symbols-rounded" aria-hidden="true">more_horiz</span>
        </button>
      </div>

      <div class="lf-screen__body lf-screen__body--web lf-screen__body--centered lf-gap-7">

        <!-- 초대 링크는 1회용 + 72시간 만료 -->
        <p class="lf-notice lf-notice--pink">
          <span class="material-symbols-rounded" aria-hidden="true">schedule</span>
          <span class="lf-notice__timer">47:12:08</span>
          <span>안에 확인해 주세요</span>
        </p>

        <div class="lf-oval lf-oval--web" aria-hidden="true">
          <span class="lf-oval__inner"></span>
          <span class="lf-pinky-loop lf-pinky-loop--eyes">
            <span class="lf-pinky-loop__hand lf-pinky-loop__hand--left"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
            <span class="lf-pinky-loop__hand lf-pinky-loop__hand--right"><img class="lf-pinky-loop__img" src="../../assets/images/hand-solid.png" alt=""></span>
            <span class="lf-pinky-loop__spark"></span>
          </span>
        </div>

        <h1 class="lf-title lf-title--heavy">민준님,<br>지우님이 새끼손가락을<br>내밀었어요!</h1>

        <div class="lf-card lf-card--web lf-card--fill lf-text-left">
          <p class="lf-eyebrow">약속 미리보기</p>
          <p class="lf-preview__title">매주 화·목 아침 러닝 같이 하기</p>
          <p class="lf-preview__hint">자세한 내용은 로그인 후 볼 수 있어요</p>
        </div>

        <p class="lf-body--secondary">
          리틀핑거는 둘이 합의한 약속을 기록하고<br>지키게 돕는 서비스예요
        </p>
      </div>

      <div class="lf-screen__actions lf-screen__actions--web lf-screen__actions--plain">
        <!-- 카카오 공식 버튼 가이드 형태 플레이스홀더 (요청서 §8) -->
        <button class="lf-btn lf-btn--kakao lf-btn--kakao-login lf-btn--block" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.4.3.7.6.5l4.1-2.7c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/>
          </svg>
          <span>카카오 로그인하고 내용 보기</span>
        </button>
        <button class="lf-btn lf-btn--google lf-btn--block" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.2z"/>
            <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.2H4.3v5.7C7.9 40.9 15.4 46 24 46z"/>
            <path fill="#FBBC05" d="M11.6 28c-.5-1.3-.7-2.6-.7-4s.3-2.7.7-4v-5.7H4.3A22 22 0 0 0 2 24c0 3.6.9 6.9 2.3 9.7L11.6 28z"/>
            <path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.3 30 2 24 2 15.4 2 7.9 7.1 4.3 14.3l7.3 5.7c1.7-5.3 6.6-9.2 12.4-9.2z"/>
          </svg>
          <span>Google로 로그인하고 내용 보기</span>
        </button>
        <p class="lf-web-note">앱 설치 없이 3분이면 끝나요</p>
      </div>

    </div>
  </div>
</div>

<script src="../frame.js"></script>
</body>
</html>
