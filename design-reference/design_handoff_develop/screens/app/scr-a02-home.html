<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A02 홈 · Soft Promise — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/components-b.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A02" data-screen-name="홈 · Soft Promise">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen lf-screen--b">

      <header class="lf-appbar lf-appbar--brand">
        <span class="lf-brandmark lf-brandmark--sm" aria-hidden="true"></span>
        <h1 class="lf-appbar__title">리틀핑거</h1>
        <button class="lf-icon-button" type="button" aria-label="알림">
          <span class="material-symbols-rounded" aria-hidden="true">notifications</span>
          <span class="lf-icon-button__dot" aria-hidden="true"></span>
        </button>
      </header>

      <div class="lf-screen__body">

        <h2 class="lf-greeting">지우님, 오늘의 약속을<br>차분히 살펴볼까요?</h2>

        <!-- 가장 임박한 약속 1건 고정 히어로 -->
        <div class="lf-hero">
          <div class="lf-hero__main">
            <p class="lf-hero__flag">
              <span class="material-symbols-rounded" aria-hidden="true">alarm</span>
              <span>내일까지!</span>
            </p>
            <p class="lf-hero__title">월말까지 야식 끊기</p>
            <p class="lf-hero__sub">종료 후 함께 확인해요</p>
          </div>
          <p class="lf-hero__dday">D-1</p>
        </div>

        <div class="lf-section-head">
          <p class="lf-section-head__title">진행 중인 약속</p>
          <button class="lf-section-head__link" type="button">전체 보기</button>
        </div>

        <div class="lf-promise-list">
          <button class="lf-promise-row" type="button">
            <span class="lf-promise-row__main">
              <span class="lf-promise-row__title">매주 화·목 아침 러닝 같이 하기</span>
              <span class="lf-promise-row__meta">진행 중 · 종료일 8/11 (화) · 민준과 함께</span>
            </span>
            <span class="lf-dday">D-17</span>
          </button>
        </div>

        <!-- 이행 확인 필요 — 강조 테두리 + 응답 CTA -->
        <div class="lf-card lf-card--b lf-card--emphasis">
          <div class="lf-card__header">
            <span class="lf-chip lf-chip--urgent">이행 확인 필요</span>
            <span class="lf-card__spacer"></span>
            <span class="lf-caption">응답 기한 6일</span>
          </div>
          <p class="lf-card__title">월급날까지 배달앱 금지</p>
          <p class="lf-card__meta">민준님이 답을 기다리고 있어요</p>
          <button class="lf-btn lf-btn--filled lf-btn--compact lf-btn--block lf-home__checking-cta" type="button">지켜졌나요? 답하기</button>
        </div>

        <!-- 마이 탭 지킴율로 가는 진입점 -->
        <button class="lf-trust-strip" type="button">
          <span class="lf-brandmark lf-brandmark--xs" aria-hidden="true"></span>
          <span class="lf-trust-strip__text">지금까지 약속의 <span class="lf-trust-strip__value">87%</span>를 지켰어요</span>
          <span class="material-symbols-rounded lf-chevron" aria-hidden="true">chevron_right</span>
        </button>

        <!-- ads_enabled=false: 컴포넌트와 빈 공간을 모두 렌더링하지 않는다. -->

      </div>

      <nav class="lf-bottomnav" aria-label="주요 탭">
        <button class="lf-bottomnav__item lf-bottomnav__item--active" type="button" aria-current="page">
          <span class="lf-bottomnav__pill"><span class="material-symbols-rounded" aria-hidden="true">home</span></span>
          <span>홈</span>
        </button>
        <div class="lf-bottomnav__fab">
          <button class="lf-bottomnav__fab-circle" type="button" aria-label="약속 만들기">
            <span class="lf-brandmark lf-brandmark--xs lf-brandmark--on-primary" aria-hidden="true"></span>
          </button>
          <span>작성</span>
        </div>
        <button class="lf-bottomnav__item" type="button">
          <span class="lf-bottomnav__pill"><span class="material-symbols-rounded" aria-hidden="true">person</span></span>
          <span>마이</span>
        </button>
      </nav>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
