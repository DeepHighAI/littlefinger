<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A03 약속 작성 1/3 · Soft Promise — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/components-b.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A03" data-screen-name="약속 작성 1/3 · Soft Promise">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen lf-screen--b">

      <div class="lf-appbar">
        <button class="lf-icon-button lf-icon-button--strong" type="button" aria-label="닫기">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <h1 class="lf-appbar__title">약속 만들기</h1>
        <span class="lf-chip lf-chip--status">1 / 3</span>
      </div>

      <div class="lf-wizard-progress" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="작성 단계">
        <div class="lf-wizard-progress__fill lf-wizard-progress__fill--1of3"></div>
      </div>

      <form class="lf-screen__body lf-gap-6" id="scr-a03-step1" novalidate>

        <div>
          <h2 class="lf-wizard-title">어떤 약속인가요?</h2>
          <p class="lf-wizard-sub">조건은 다음 단계에서, 확정은 상대와 함께 해요</p>
        </div>

        <div class="lf-field">
          <label class="lf-field__label" for="a03-title">제목</label>
          <input class="lf-input" id="a03-title" name="title" type="text" value="매주 화·목 아침 러닝 같이 하기">
        </div>

        <div class="lf-field">
          <label class="lf-field__label" for="a03-content">내용</label>
          <textarea class="lf-input lf-textarea" id="a03-content" name="content">8월 11일까지 매주 화·목 아침 7시, 반포한강공원에서 함께 러닝한다. 우천 시 다음 날로 순연.</textarea>
        </div>

        <fieldset class="lf-field">
          <legend class="lf-field__label">카테고리</legend>
          <div class="lf-choices" role="group" aria-label="카테고리 선택">
            <button class="lf-choice" type="button" aria-pressed="true">습관</button>
            <button class="lf-choice" type="button" aria-pressed="false">내기</button>
            <button class="lf-choice" type="button" aria-pressed="false">금전</button>
            <button class="lf-choice" type="button" aria-pressed="false">기타</button>
          </div>
        </fieldset>

        <div class="lf-helper">
          <span class="lf-brandmark lf-brandmark--xs" aria-hidden="true"></span>
          <p>종료일·보상·벌칙은 <strong>2단계</strong>에서, 증인 초대는 <strong>3단계</strong>에서 정해요</p>
        </div>

      </form>

      <div class="lf-screen__actions">
        <button class="lf-btn lf-btn--text lf-btn--block" type="button">임시저장</button>
        <button class="lf-btn lf-btn--filled lf-btn--cta lf-btn--block" type="submit" form="scr-a03-step1">
          <span>조건 정하기</span>
          <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
        </button>
      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
