<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A04 초대 전송·대기 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-create.css">
<link rel="stylesheet" href="../../styles/screen-page.css">
</head>
<body class="lf-page" data-screen-id="SCR-A04" data-screen-name="초대 전송·대기">
<div class="lf-device">
  <div class="lf-device__viewport">

    <!-- 초대 발송 후 상대 승인을 기다리는 화면. O-D1 기본안: 철회 버튼 없이 재발송만 제공(만료 시 활성화). -->
    <div class="lf-screen">

      <div class="lf-appbar">
        <button class="lf-icon-button lf-icon-button--strong" type="button" aria-label="뒤로가기">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">초대 보내기</h1>
        <span class="lf-chip lf-chip--neutral">승인 대기</span>
      </div>

      <div class="lf-screen__body">

        <div class="lf-stamp lf-stamp--compact">
          <svg class="lf-pinky lf-pinky--md lf-pinky--on-container lf-pinky--hooked" viewBox="0 0 120 120" aria-hidden="true">
            <path class="lf-pinky__left"  d="M40 14 L40 62 A21 21 0 0 0 82 62 L82 50"/>
            <path class="lf-pinky__right" d="M80 106 L80 58 A21 21 0 0 0 38 58 L38 70"/>
          </svg>
          <h2 class="lf-stamp__headline">민준님에게 손가락을 내밀어 볼까요?</h2>
          <p class="lf-stamp__time">카톡으로 초대장을 보내면, 민준님이 걸어야 성립돼요</p>
        </div>

        <!-- 카톡 공유 시트 진입점. 실제 공식 버튼 가이드 형태의 플레이스홀더(요청서 §8) -->
        <button class="lf-btn lf-btn--kakao lf-btn--cta lf-btn--block" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.6 21c-.1.4.3.7.6.5l4.1-2.7c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/>
          </svg>
          <span>카카오톡으로 초대 보내기</span>
        </button>

        <div>
          <p class="lf-section-title">민준님에게는 이렇게 보여요</p>
          <div class="lf-kakao-preview lf-row lf-align-start lf-gap-3">
            <div class="lf-avatar" aria-hidden="true">지</div>
            <div class="lf-kakao-bubble">
              <p class="lf-list-item__headline">지우님이 새끼손가락을 내밀었어요!</p>
              <p class="lf-body--secondary">약속: 매주 화·목 아침 러닝 같이 하기</p>
              <p class="lf-kakao-bubble__cta">약속 확인하기</p>
            </div>
          </div>
        </div>

        <!-- 72시간 만료 카운트다운 -->
        <div class="lf-card lf-card--web lf-stack lf-gap-4">
          <div class="lf-row lf-gap-4">
            <span class="material-symbols-rounded lf-countdown-card__icon" aria-hidden="true">schedule</span>
            <div class="lf-grow">
              <p class="lf-caption">초대 링크 유효 시간</p>
              <p class="lf-dday lf-dday--lg lf-notice__timer">71:59:32</p>
            </div>
          </div>
          <div class="lf-progress">
            <div class="lf-progress__fill lf-invite-countdown__fill"></div>
          </div>
          <p class="lf-caption">링크는 1회용이에요 · 만료되면 아래에서 재발송할 수 있어요</p>
        </div>

        <!-- O-D1: 철회 버튼 없음. 재발송은 만료 후에만 활성화 -->
        <button class="lf-btn lf-btn--outlined lf-btn--block" type="button" aria-disabled="true">
          <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
          <span>재발송 — 만료 후 가능</span>
        </button>

      </div>

    </div>
  </div>
</div>

<script src="../frame.js"></script>
</body>
</html>
