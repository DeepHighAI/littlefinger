<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-A09 지난 약속 히스토리 — 리틀핑거</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="../../styles/screens/app-entry.css">

<!-- ADR 0011 (PO 2026-08-26): 종결 약속 전용 화면. 홈의 완료 탭을 대체한다.
     탭 4개 — 완료 / 불이행 / 협의 중단(의견 불일치·미확정 종결) / 거절·파기.
     의견 불일치를 '불이행'에 넣지 않는 분리는 P1(판정하지 않는다)의 요구다.
     광고 슬롯 없음 — F-12 허용 지면은 A02·A07·A08 뿐이다. -->
<body class="lf-page" data-screen-id="SCR-A09" data-screen-name="지난 약속 히스토리">
<div class="lf-device">
  <div class="lf-device__viewport">
    <div class="lf-screen">

      <header class="lf-appbar">
        <button class="lf-icon-button" type="button" aria-label="뒤로">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="lf-appbar__title">지난 약속</h1>
      </header>

      <div class="lf-tabs" role="tablist" aria-label="지난 약속 분류">
        <button class="lf-tab" type="button" role="tab" aria-selected="true">완료 3</button>
        <button class="lf-tab" type="button" role="tab" aria-selected="false">불이행 1</button>
        <button class="lf-tab" type="button" role="tab" aria-selected="false">협의 중단 1</button>
        <button class="lf-tab" type="button" role="tab" aria-selected="false">거절·파기 2</button>
      </div>

      <div class="lf-screen__body lf-home__body">

        <ul class="lf-home__list">
          <li class="lf-home__row">
            <div class="lf-home__row-main">
              <p class="lf-home__row-title">월말까지 야식 끊기</p>
              <p class="lf-home__row-meta"><strong>완료</strong> · 종료일 8/11 (화) · 지우 — 민준</p>
            </div>
          </li>
          <li class="lf-home__row">
            <div class="lf-home__row-main">
              <p class="lf-home__row-title">매주 화·목 아침 러닝 같이 하기</p>
              <p class="lf-home__row-meta"><strong>완료</strong> · 종료일 7/29 (수) · 지우 — 민준</p>
            </div>
          </li>
          <li class="lf-home__row">
            <div class="lf-home__row-main">
              <p class="lf-home__row-title">한 달 동안 아침 스트레칭</p>
              <p class="lf-home__row-meta"><strong>완료</strong> · 종료일 7/15 (수) · 지우 — 하영</p>
            </div>
          </li>
        </ul>

      </div>

    </div>
  </div>
</div>
<script src="../frame.js"></script>
</body>
</html>
